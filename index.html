<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Serverless AWS</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; margin-top: 50px; background-color: #cccc; }
        .card { background:#ad6a91; padding: 25px; border-radius: 8px; box-shadow: 0 2px 10px rgb(131, 45, 230); width: 300px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 93%; padding: 8px; font-size: 16px; border: 1px solid #f8a3d5; border-radius: 4px; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; padding: 10px; font-size: 16px; cursor: pointer; border: none; border-radius: 4px; background-color: #8f0053; color: f8a3d5; }
        button:hover { background-color: #8f0053; }
        #resultado { margin-top: 20px; font-weight: bold; font-size: 18px; text-align: center; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Calculadora da barbie</h2>
        
        <div class="form-group">
            <label for="num1">Número 1:</label>
            <input type="number" id="num1" placeholder="Digite o primeiro número">
        </div>

        <div class="form-group">
            <label for="num2">Número 2:</label>
            <input type="number" id="num2" placeholder="Digite o segundo número">
        </div>

        <div class="btn-group">
            <button onclick="calcular('soma')">+</button>
            <button onclick="calcular('sub')">-</button>
            <button onclick="calcular('mult')">*</button>
        </div>

        <div id="resultado">Resultado: -</div>
    </div>

    <script>
        async function calcular(operacao) {
            const num1 = document.getElementById('num1').value;
            const num2 = document.getElementById('num2').value;

            if (num1 === '' || num2 === '') {
                alert('Por favor, preencha os dois campos!');
                return;
            }
            const baseUrl = 'https://scpjas46oa.execute-api.us-east-1.amazonaws.com/';
            const url = `${baseUrl}/${operacao}?a=${num1}&b=${num2}`;

            document.getElementById('resultado').innerText = 'Calculando...';

            try {
                const response = await fetch(url);
                const data = await response.json();
                document.getElementById('resultado').innerText = `Resultado: ${data.resultado}`;
            } catch (error) {
                console.error('Erro na requisição:', error);
                document.getElementById('resultado').innerText = 'Erro ao realizar o cálculo.';
            }
        }
    </script>
</body>
</html>
